apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculadora-backend
  namespace: practice-4
  labels:
    app.kubernetes.io/name: calculadora-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: calculadora-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calculadora-backend
    spec:
      containers:
        - name: backend
          image: calculadora-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: calculadora-backend
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
